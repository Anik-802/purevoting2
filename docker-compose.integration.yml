# Integration stack (week 3 T01 onward), on top of docker-compose.yml. Compose reads .env once, when a command starts,
# so the values registry-setup writes there (CHAIN_ID, CONTRACT_ADDRESS, PINNED_NODE_URL) reach the other services only
# from the next command. On a fresh chain, run the bootstrap first, then the stack:
#   docker compose -f docker-compose.yml -f docker-compose.integration.yml run --rm registry-setup
#   docker compose -f docker-compose.yml -f docker-compose.integration.yml up -d --build
# (registry-setup runs again in `up`: it finds every step done and only rewrites the same three values. Skipping the
# first command leaves Core not ready with "chain_config_missing" on /readyz.) Back up .env before a bootstrap: it holds
# the org keys registered on chain, and the job rewrites the file in place.
# Bootstrap order (docs/system-design.md section 7, #6): nodes → contract deploy → registry setup → staff accounts →
# Core, Gateway, Rule Engine. Each step that must finish first is a one-shot service the next one depends on.
# Needs the purechain-geth binary of Harits's kit at ledger/bin/purechain-geth (or PURECHAIN_GETH_BIN) and the nine
# key lines of .env (ledger/tools/gen_keys.py).
# Slots marked OWNER are filled by that owner's compose block (Dockerfile, healthcheck, .env keys); Seungmin merges them.
# No mock profile here: the Gateway is Harits's ledger-gateway (same service name) and Core reads the pinned nodes.
x-purechain-geth: &purechain-geth
  # purechain-geth v1.0.1 linux-amd64 from Harits's kit, not committed (ledger/bin/ is ignored); chain-init checks its
  # sha256. A missing file stops compose instead of creating a directory in its place.
  type: bind
  source: ${PURECHAIN_GETH_BIN:-./ledger/bin/purechain-geth}
  target: /usr/local/bin/geth
  read_only: true
  bind: { create_host_path: false }

x-validator: &validator
  image: python:3.11.14-slim   # Debian, for glibc and sh; the node runs only the mounted binary
  entrypoint: ["sh", "/job/chain_node.sh"]
  depends_on:
    chain-init:
      condition: service_completed_successfully
  healthcheck:
    # sealing, peered and the chain moving: newest block at most 15 s old (with three Clique signers one node alone cannot keep
    # sealing, and blocks come every second, also empty ones)
    test: ["CMD-SHELL", "test \"$$(geth attach --exec 'eth.mining && net.peerCount >= 1 && eth.blockNumber > 0 && eth.getBlock(eth.blockNumber).timestamp > Date.now() / 1000 - 15' /data/geth.ipc)\" = true"]
    interval: 5s
    timeout: 5s
    retries: 24
    start_period: 30s
  stop_grace_period: 30s   # geth flushes its database on SIGTERM
  restart: unless-stopped

services:
  # Validator nodes (D-03): node-commission, node-observer, node-neutral, PureChain 1.13.15-purechain-1.0.1, one per
  # organization, Clique with a 1 s period, chain id ${PURECHAIN_CHAIN_ID:-424242}, JSON-RPC on 8545 inside the compose
  # network. Start flags from Harits (ledger/NETWORK.md); accounts, genesis and node keys are made on this machine by
  # chain-init and never leave the node volumes. Peering: fixed addresses on the "chain" network and StaticNodes in
  # each node's config.toml (CHAIN_NET_PREFIX if 172.29.42.0/24 is taken on this host). A fresh chain = remove the
  # three node volumes and empty CONTRACT_ADDRESS in .env.
  chain-init:
    image: python:3.11.14-slim
    entrypoint: ["python", "-I", "/job/chain_init_job.py"]
    environment:
      PURECHAIN_GETH_SHA256: ${PURECHAIN_GETH_SHA256:-a251a17ca6d716d7518c258480c4a7a5380b1003cc4291b68be86d387265db25}
      PURECHAIN_CHAIN_ID: ${PURECHAIN_CHAIN_ID:-424242}
      CHAIN_NET_PREFIX: ${CHAIN_NET_PREFIX:-172.29.42}
    volumes:
      - ./tools/chain_init_job.py:/job/chain_init_job.py:ro
      - *purechain-geth
      - node-commission-data:/nodes/commission
      - node-observer-data:/nodes/observer
      - node-neutral-data:/nodes/neutral
    network_mode: none
    restart: "no"

  node-commission:
    <<: *validator
    environment: { NODE_NAME: PV-Validator-commission, SEAL_AFTER: "0" }   # seals first; tools/chain_node.sh
    volumes:
      - ./tools/chain_node.sh:/job/chain_node.sh:ro
      - *purechain-geth
      - node-commission-data:/data
    networks:
      default: {}
      chain: { ipv4_address: "${CHAIN_NET_PREFIX:-172.29.42}.11" }
    ports:
      - "127.0.0.1:${NODE_RPC_PORT:-8545}:8545"   # for checks from this host only

  node-observer:
    <<: *validator
    environment: { NODE_NAME: PV-Validator-observer, SEAL_AFTER: "60" }   # alone after 60 s if commission is down
    volumes:
      - ./tools/chain_node.sh:/job/chain_node.sh:ro
      - *purechain-geth
      - node-observer-data:/data
    networks:
      default: {}
      chain: { ipv4_address: "${CHAIN_NET_PREFIX:-172.29.42}.12" }

  node-neutral:
    <<: *validator
    environment: { NODE_NAME: PV-Validator-neutral, SEAL_AFTER: "120" }
    volumes:
      - ./tools/chain_node.sh:/job/chain_node.sh:ro
      - *purechain-geth
      - node-neutral-data:/data
    networks:
      default: {}
      chain: { ipv4_address: "${CHAIN_NET_PREFIX:-172.29.42}.13" }

  # Contract build: solc 0.8.28, EVM shanghai, optimizer on with 200 runs (ledger/README.md; without the optimizer the
  # compile fails with "stack too deep").
  contract-build:
    image: ethereum/solc:0.8.28
    command: ["--optimize", "--optimize-runs", "200", "--evm-version", "shanghai", "--bin", "--overwrite",
              "-o", "/build", "/src/PureVotingLedger.sol"]
    volumes:
      - ./ledger/contracts:/src:ro
      - chain-build:/build
    restart: "no"

  # Contract deploy and registry setup (Harits's ledger/tools/setup_registry.py, run by tools/registry_setup_job.sh):
  # deploys from the neutral org's node account unless .env already has CONTRACT_ADDRESS, registers the three org
  # signers, confirms operatorOrg, gatewayAccount and ruleEngineSigner, then writes CHAIN_ID, CONTRACT_ADDRESS and
  # PINNED_NODE_URL into .env (mounted read-write). Keys are read from .env and never printed.
  registry-setup:
    image: python:3.11.14-slim   # pinned: this container sees the whole .env
    entrypoint: ["sh", "/job/registry_setup_job.sh"]
    environment:
      BOOTSTRAP_RPC_URL: ${BOOTSTRAP_RPC_URL:-http://node-commission:8545}
      # observer first, commission second: both run by orgs other than the Gateway operator (D-03, D-26)
      BOOTSTRAP_PINNED_NODE_URL: ${BOOTSTRAP_PINNED_NODE_URL:-http://node-observer:8545,http://node-commission:8545}
    volumes:
      - ./tools/registry_setup_job.sh:/job/registry_setup_job.sh:ro
      - ./ledger/tools:/ledger/tools:ro
      - ./ledger/tests:/ledger/tests:ro
      - chain-build:/build:ro
      - ${CHAIN_ENV_FILE:-./.env}:/work/chain.env
    depends_on:
      contract-build:
        condition: service_completed_successfully
      node-commission: { condition: service_healthy }
      node-observer: { condition: service_healthy }
      node-neutral: { condition: service_healthy }
    restart: "no"

  # Staff accounts (Seungmin): no account API (threat-model O1); an account that exists is left unchanged.
  # T01 logs in with this account (tests/scenarios/T01/README.md: T01_USERNAME / T01_PASSWORD).
  # It builds the same image as core (a second build step, cached).
  staff-setup:
    build:
      context: .
      dockerfile: core/Dockerfile
    command: ["python", "-m", "app.scripts.create_staff", "--username", "${STAFF_ADMIN_USERNAME:-admin1}",
              "--org", "org_commission", "--role", "admin"]
    environment:
      DATABASE_URL: postgresql+psycopg://pv2_core:${DB_CORE_PASSWORD}@db:5432/${POSTGRES_DB:-purevoting}
      STAFF_PASSWORD: ${STAFF_ADMIN_PASSWORD:?set STAFF_ADMIN_PASSWORD in .env (at least 8 characters)}
    depends_on:
      db:
        condition: service_healthy
      registry-setup:
        condition: service_completed_successfully
    restart: "no"

  core:
    environment:
      CREATION_CHECK_MODE: node            # T01 needs the direct node read (core-web.md: the stub is removed for T01)
    depends_on:
      staff-setup:
        condition: service_completed_successfully

  # Ledger Gateway (Harits, ledger/gateway/compose-snippet.yml): replaces the mock of docker-compose.yml under the same
  # name. It sends through its operator's own node (org_neutral, D-26). CHAIN_ID / CONTRACT_ADDRESS / PINNED_NODE_URL as
  # ${VAR:-} (the Gateway refuses empty values at start), never ${VAR:?}: they are empty until the bootstrap ran, and a
  # required check would block the bootstrap command itself. The volume keeps its database across restarts.
  ledger-gateway:
    profiles: !reset []
    build: { context: ., dockerfile: ledger/gateway/Dockerfile }
    command: ["python3", "-I", "ledger/gateway/gw_server.py", "--port", "8100", "--host", "0.0.0.0", "--db", "/data/gateway.db"]
    environment:
      CHAIN_ID: ${CHAIN_ID:-}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:-}
      GATEWAY_ACCOUNT_KEY: ${GATEWAY_ACCOUNT_KEY:?set GATEWAY_ACCOUNT_KEY}
      GATEWAY_RPC_URL: http://node-neutral:8545
      PINNED_NODE_URL: ${PINNED_NODE_URL:-}
      CONFIRMATION_DEPTH: ${CONFIRMATION_DEPTH:-2}
      ANCHOR_BATCH_SECONDS: ${ANCHOR_BATCH_SECONDS:-60}
      ANCHOR_BATCH_MAX_EVENTS: ${ANCHOR_BATCH_MAX_EVENTS:-50}
      CORE_KEY: ${CORE_KEY:?set CORE_KEY}
      RULE_KEY: ${RULE_KEY:?set RULE_KEY}
      AGENT_KEY: ${AGENT_KEY:-}
      AUDITOR_KEY: ${AUDITOR_KEY:-}
      GATEWAY_KEY: ${GATEWAY_KEY:?set GATEWAY_KEY}
      CORE_URL: http://core:8000
    volumes:
      - ledger-gateway-data:/data
    depends_on:
      registry-setup: { condition: service_completed_successfully }
      node-neutral: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/v1/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # Anik: integration only. Part B's base --profile mock stack does not start a Rule Engine.
  rule-engine:
    build: { context: rules }
    entrypoint: ["python", "-m", "purevoting_rules.live_worker"]
    command: []
    environment:
      CORE_URL: http://core:8000
      GATEWAY_URL: http://ledger-gateway:8100
      RULE_KEY: ${RULE_KEY:?set RULE_KEY}
      RULE_ENGINE_SIGNER_KEY: ${RULE_ENGINE_SIGNER_KEY:?set RULE_ENGINE_SIGNER_KEY}
      # written by registry-setup, so empty on a fresh chain until the bootstrap ran (a required-variable check here would
      # block the bootstrap command itself); live_chain.py refuses empty or malformed values at start
      CHAIN_ID: ${CHAIN_ID:-}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:-}
      PINNED_NODE_URL: ${PINNED_NODE_URL:-}
      CONFIRMATION_DEPTH: ${CONFIRMATION_DEPTH:-2}
      RULE_POLL_SECONDS: ${RULE_POLL_SECONDS:-60}
      ANCHOR_BATCH_SECONDS: ${ANCHOR_BATCH_SECONDS:-60}
      RULE_STATE_DIR: /var/lib/purevoting/rules
      PUREVOTING_REFERENCE_ROOT: /reference
    volumes:
      - rules-state:/var/lib/purevoting/rules
      - ./contracts:/reference/contracts:ro
    depends_on:
      core: { condition: service_healthy }
      ledger-gateway: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-m", "purevoting_rules.live_worker", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped

  # OWNER Anik (rules/): audit-agent for the M2 demo (D-15 v1.2, zero cost). Needs AGENT_KEY, CORE_URL, GATEWAY_URL
  # (most agent tools are Gateway reads), AI_PROVIDER (none = template report, else the local runtime Anik picks), AI_BASE_URL,
  # AI_MODEL and a volume for the report files; on a Linux host extra_hosts: ["host.docker.internal:host-gateway"];
  # depends on core and ledger-gateway being healthy.
  #
  # audit-agent:
  #   build: { context: rules }
  #   ...

volumes:
  rules-state:
  chain-build:
  node-commission-data:
  node-observer-data:
  node-neutral-data:
  ledger-gateway-data:

networks:
  # validator p2p on fixed addresses (the StaticNodes of chain-init); the nodes are also on the default network for RPC
  chain:
    ipam:
      config:
        - subnet: "${CHAIN_NET_PREFIX:-172.29.42}.0/24"
