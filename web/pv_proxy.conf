# shared by every /v1/ location of nginx.conf
if ($request_uri !~ "^/v1/") {
    return 404;
}
proxy_pass $core;
proxy_http_version 1.1;
# $http_host keeps the port; Core does not trust X-Forwarded-* (uvicorn without --proxy-headers), so none are sent and
# a client-supplied X-Forwarded-For is dropped (Core never sees client addresses)
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For "";
proxy_read_timeout 60s;
add_header X-Content-Type-Options nosniff always;
