# Public entry of the stack (D-29): the built web plus the public / staff Core API (/v1/) on one origin.
# This is the only port a tunnel (Tailscale Funnel / Serve) exposes; Core's /internal/v1/*, its API docs, the database,
# the Gateway and the nodes are never reachable through it.

# The tunnel hands every request over from the same local address, so per-client limits are impossible; these zones
# cap the whole site (Core itself has no RATE_LIMITED yet, a limit stated in the report). Receipt polling has its own
# zone so it can never starve redeem / ballot submissions.
limit_req_zone $server_name zone=login:1m rate=30r/m;
limit_req_zone $server_name zone=voter:1m rate=20r/s;
limit_req_zone $server_name zone=receipt:1m rate=30r/s;

server {
    listen 8080;
    server_name purevoting;
    server_tokens off;
    client_max_body_size 1m;
    # no request log: exact times and receipt paths would undo the bucketing of voter events (threat-model S1)
    access_log off;

    # resolve "core" per request so the web starts even when Core is not up yet
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $core http://core:8000;

    # proxy_pass with a variable forwards the raw request URI, so refuse anything that normalises differently
    if ($request_uri ~* "(\.\.|%2e|%2f|%5c)") {
        return 400;
    }

    limit_req_status 429;
    error_page 429 = @rate_limited;

    location = /v1/auth/login {
        limit_req zone=login burst=10 nodelay;
        include /etc/nginx/pv_proxy.conf;
    }

    location ~ ^/v1/public/receipts/ {
        limit_req zone=receipt burst=200 nodelay;
        include /etc/nginx/pv_proxy.conf;
    }

    location ~ ^/v1/(public/elections/|credentials:redeem$|ballots$) {
        limit_req zone=voter burst=100 nodelay;
        include /etc/nginx/pv_proxy.conf;
    }

    location /v1/ {
        include /etc/nginx/pv_proxy.conf;
    }

    # same body as Core's problem responses (contracts/common.schema.json#/$defs/Problem); refused before Core, so a
    # retry is always safe
    location @rate_limited {
        default_type application/problem+json;
        add_header Retry-After 2 always;
        return 429 '{"type":"about:blank","title":"rate limited","status":429,"code":"RATE_LIMITED"}';
    }

    # never served from the public entry
    location ~ ^/(internal|docs|redoc|openapi\.json|healthz|readyz)(/|$) {
        return 404;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # single-page app: every other path loads index.html (/vote/<id>, /receipt, /admin/...);
    # 'wasm-unsafe-eval' only lets libsodium compile its WebAssembly, eval of strings stays blocked
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";
    }
}
