# Dev only: one upstream geth 1.13.15 node (PureChain is a fork of this version) answering under the three validator
# names, so the contract deploy and registry setup jobs can run before Harits's node block is merged. It is not
# PureChain and not three operators (D-03): never use it for M1, the demo or any measurement. Its chain id 20261111
# (registry-setup prints a warning on it) and the CONTRACT_ADDRESS it wrote must not stay in .env for the real chain.
#   docker compose -f docker-compose.yml -f docker-compose.integration.yml -f docker-compose.chain-standin.yml \
#     run --rm registry-setup
# Base fee stays 0 (genesis baseFeePerGas 0, blocks far below the gas target), so the gas price 0 transactions of
# setup_registry.py are accepted like on PureChain. Blocks every second, also empty ones (D-02).
services:
  chain-standin:
    image: ethereum/client-go:v1.13.15
    entrypoint: ["sh", "-c"]
    command:
      - >-
        geth init --datadir /data /genesis.json &&
        exec geth --dev --dev.period 1 --datadir /data --nodiscover
        --http --http.addr 0.0.0.0 --http.vhosts '*' --http.api eth,net,web3
    volumes:
      - ./core/devtools/chain-standin-genesis.json:/genesis.json:ro
      - chain-standin-data:/data
    networks:
      default:
        aliases: [node-commission, node-observer, node-neutral]
    ports:
      - "127.0.0.1:${NODE_RPC_PORT:-8545}:8545"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--header", "Content-Type: application/json",
             "--post-data", '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}', "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 3s
      retries: 20

  # `run --rm registry-setup` starts only its dependencies, so the stand-in node is one of them here
  registry-setup:
    depends_on:
      chain-standin:
        condition: service_healthy

volumes:
  chain-standin-data:
