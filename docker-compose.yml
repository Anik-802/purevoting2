# PureVoting 2.0 — local stack. Copy .env.example to .env, fill in the <set> values, then: docker compose up --build
# Week 1: database + Core. The other owners add their services (with a healthcheck) here; Seungmin merges them in the
# bootstrap order of docs/system-design.md section 7 (#6): nodes → contract deploy → registry setup → staff accounts →
# Core, Gateway, Rule Engine.
services:
  db:
    image: postgres:16.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-purevoting}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      DB_CORE_PASSWORD: ${DB_CORE_PASSWORD:?set DB_CORE_PASSWORD in .env}   # read by core/db/init/00_roles.sh
    # commit timestamps would let anyone with DB access pair token use and credential registration (threat-model S2)
    command: ["postgres", "-c", "track_commit_timestamp=off"]
    volumes:
      - ./core/db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # local only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-purevoting}"]
      interval: 5s
      timeout: 3s
      retries: 20

  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://pv2_core:${DB_CORE_PASSWORD}@db:5432/${POSTGRES_DB:-purevoting}
      GATEWAY_URL: http://ledger-gateway:8100   # container port; GATEWAY_PORT is only the host side
      CORE_KEY: ${CORE_KEY:-}
      RULE_KEY: ${RULE_KEY:-}
      AGENT_KEY: ${AGENT_KEY:-}
      GATEWAY_KEY: ${GATEWAY_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      CHAIN_ID: ${CHAIN_ID:-}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:-}
      PINNED_NODE_URL: ${PINNED_NODE_URL:-}
      CONFIRMATION_DEPTH: ${CONFIRMATION_DEPTH:-2}   # D-27; Gateway and Rule Engine blocks pass it too
      CREATION_CHECK_MODE: ${CREATION_CHECK_MODE:-node}   # reads the pinned node; "stub" (dev only) assumes it matches
      VOTER_WEB_URL: ${VOTER_WEB_URL:-http://127.0.0.1:3000}   # the Funnel address when published (D-29)
      ALL_VOTED_CLOSE: ${ALL_VOTED_CLOSE:-true}   # decisions v1.5 (fake Gateway); the integration override defaults to false
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CORE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Voter / admin web and the only public entry (D-29): nginx serves the built web and Core's /v1/ on one origin and
  # blocks /internal/v1/* and the API docs. Bound to 127.0.0.1; a Tailscale Funnel on this host publishes it over HTTPS.
  web:
    build:
      context: ./web
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Stand-in Gateway for Core development before week 3 (no chain, no signature checks): docker compose --profile mock up
  # Kept in the mock profile until 11-24 (part B of the M2 demo runs on it); Harits's real ledger-gateway comes in only
  # through docker-compose.integration.yml (docs/schedule.md).
  ledger-gateway:
    profiles: ["mock"]
    build:
      context: .
      dockerfile: core/Dockerfile
    command: ["uvicorn", "devtools.fake_gateway:app", "--host", "0.0.0.0", "--port", "8100", "--no-access-log"]
    environment:   # the same pinned chain configuration as Core (GET /v1/chain and the /rpc node stand-in)
      CHAIN_ID: ${CHAIN_ID:-}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:-}
      CONFIRMATION_DEPTH: ${CONFIRMATION_DEPTH:-2}
      PINNED_NODE_URL: ${PINNED_NODE_URL:-}   # mock: http://ledger-gateway:8100/rpc
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8100}:8100"

volumes:
  pgdata:
